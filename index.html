<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 確保在手機上全螢幕且不可縮放，適合雙平台遊玩 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kirby Survivor (卡比倖存者)</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #222; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<script>
class MainScene extends Phaser.Scene {
    constructor() {
        super('MainScene');
    }

    preload() {
        // 載入卡比待機圖 (GBA 像素風)
        this.load.image('kirby', 'assets/kirby_idle.png');
    }

    create() {
        // --- 1. 遊戲世界與環境設定 ---
        this.physics.world.setBounds(0, 0, 2000, 2000);
        
        // 畫一個簡單的網格背景代表地板
        this.add.grid(1000, 1000, 2000, 2000, 64, 64, 0x339933, 1, 0x228822, 1);

        // --- 2. 玩家設定 ---
        this.player = this.physics.add.sprite(1000, 1000, 'kirby');
        this.player.setScale(0.06); // 依據你 AI 生成的圖片大小調整此數值 (0.05 ~ 0.1 之間測試)
        this.player.setCollideWorldBounds(true);
        this.player.hp = 100;
        this.player.maxHp = 100;
        this.player.level = 1;
        this.player.exp = 0;
        this.player.expNext = 10;

        // 攝影機跟隨玩家
        this.cameras.main.setBounds(0, 0, 2000, 2000);
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);

        // --- 3. 群組設定 (敵人、寶石、攻擊特效) ---
        this.enemies = this.physics.add.group();
        this.gems = this.physics.add.group();
        this.attacks = this.physics.add.group();

        // --- 4. 碰撞與判定 ---
        // 玩家碰到寶石 -> 吃掉加經驗
        this.physics.add.overlap(this.player, this.gems, this.collectGem, null, this);
        // 攻擊碰到敵人 -> 敵人扣血或死亡
        this.physics.add.overlap(this.attacks, this.enemies, this.hitEnemy, null, this);
        // 敵人碰到玩家 -> 玩家扣血
        this.physics.add.overlap(this.player, this.enemies, this.takeDamage, null, this);

        // --- 5. 控制設定 (鍵盤與觸控) ---
        this.cursors = this.input.keyboard.createCursorKeys();
        this.wasd = this.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            down: Phaser.Input.Keyboard.KeyCodes.S,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D
        });

        // --- 6. 定時器 (生成敵人與自動攻擊) ---
        this.time.addEvent({ delay: 1000, callback: this.spawnEnemy, callbackScope: this, loop: true });
        this.time.addEvent({ delay: 1500, callback: this.autoAttack, callbackScope: this, loop: true });

        // --- 7. UI 介面 ---
        this.uiText = this.add.text(16, 16, '', { fontSize: '24px', fill: '#FFF', fontStyle: 'bold' }).setScrollFactor(0);
        this.updateUI();
    }

    update() {
        // --- 玩家移動邏輯 ---
        this.player.setVelocity(0);
        const speed = 180;
        let isMoving = false;

        // 鍵盤操控
        if (this.cursors.left.isDown || this.wasd.left.isDown) {
            this.player.setVelocityX(-speed);
            this.player.setFlipX(true); // 面向左邊
            isMoving = true;
        } else if (this.cursors.right.isDown || this.wasd.right.isDown) {
            this.player.setVelocityX(speed);
            this.player.setFlipX(false); // 面向右邊
            isMoving = true;
        }

        if (this.cursors.up.isDown || this.wasd.up.isDown) {
            this.player.setVelocityY(-speed);
            isMoving = true;
        } else if (this.cursors.down.isDown || this.wasd.down.isDown) {
            this.player.setVelocityY(speed);
            isMoving = true;
        }

        // 手機/滑鼠觸控跟隨 (若沒按鍵盤且點擊螢幕)
        if (!isMoving && this.input.activePointer.isDown) {
            this.physics.moveToObject(this.player, { x: this.input.activePointer.worldX, y: this.input.activePointer.worldY }, speed);
            // 根據 X 速度判斷翻轉
            if (this.player.body.velocity.x < 0) this.player.setFlipX(true);
            else if (this.player.body.velocity.x > 0) this.player.setFlipX(false);
        }

        // --- 敵人追蹤玩家 ---
        this.enemies.getChildren().forEach(enemy => {
            this.physics.moveToObject(enemy, this.player, 80); // 怪物移動速度
        });
    }

    // --- 遊戲機制函數 ---

    spawnEnemy() {
        // 在玩家螢幕外隨機生成敵人 (先用紅色方塊代替，未來可換圖片)
        const angle = Phaser.Math.Between(0, 360);
        const distance = Phaser.Math.Between(400, 600);
        const x = this.player.x + Math.cos(angle) * distance;
        const y = this.player.y + Math.sin(angle) * distance;
        
        let enemy = this.add.rectangle(x, y, 30, 30, 0xff0000);
        this.physics.add.existing(enemy);
        this.enemies.add(enemy);
    }

    autoAttack() {
        // 尋找最近的敵人
        let closest = this.physics.closest(this.player, this.enemies.getChildren());
        if (closest) {
            // 發射簡單的劍氣 (青色方塊代替)
            let attack = this.add.rectangle(this.player.x, this.player.y, 20, 20, 0x00ffff);
            this.physics.add.existing(attack);
            this.attacks.add(attack);
            this.physics.moveToObject(attack, closest, 400); // 攻擊飛行速度
            
            // 1秒後自動銷毀攻擊特效
            this.time.delayedCall(1000, () => { if (attack.active) attack.destroy(); });
        }
    }

    hitEnemy(attack, enemy) {
        attack.destroy(); // 銷毀劍氣
        
        // 掉落經驗寶石 (黃色小圓形)
        let gem = this.add.circle(enemy.x, enemy.y, 8, 0xffff00);
        this.physics.add.existing(gem);
        this.gems.add(gem);
        
        enemy.destroy(); // 銷毀敵人
    }

    collectGem(player, gem) {
        gem.destroy();
        this.player.exp += 2;
        if (this.player.exp >= this.player.expNext) {
            this.player.level++;
            this.player.exp -= this.player.expNext;
            this.player.expNext = Math.floor(this.player.expNext * 1.5);
            // 升級時可在此觸發升級選單
            console.log("Level Up!");
        }
        this.updateUI();
    }

    takeDamage(player, enemy) {
        if (!player.isInvulnerable) {
            player.hp -= 10;
            player.isInvulnerable = true;
            player.setAlpha(0.5); // 受傷閃爍效果
            this.time.delayedCall(500, () => {
                player.isInvulnerable = false;
                player.setAlpha(1);
            });
            
            if (player.hp <= 0) {
                // 遊戲結束邏輯
                player.hp = 0;
                this.scene.restart(); 
            }
            this.updateUI();
        }
    }

    updateUI() {
        this.uiText.setText(`Lv: ${this.player.level} | EXP: ${this.player.exp}/${this.player.expNext}\nHP: ${this.player.hp}/${this.player.maxHp}`);
    }
}

const config = {
    type: Phaser.AUTO,
    scale: {
        mode: Phaser.Scale.RESIZE, // 自動適應視窗大小 (桌面與手機通用)
        parent: 'phaser-example',
        width: '100%',
        height: '100%'
    },
    pixelArt: true, // 確保像素圖邊緣銳利
    physics: {
        default: 'arcade',
        arcade: { debug: false }
    },
    scene: MainScene
};

const game = new Phaser.Game(config);
</script>
</body>
</html>
